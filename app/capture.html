<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'; img-src 'self' file: data:; connect-src 'none'; frame-src 'none'">
<title>Nyx — quick capture</title><link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Inter,system-ui}
.c{position:absolute;inset:10px;border-radius:18px;background:rgba(14,16,26,.94);border:1px solid rgba(124,140,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;padding:12px 14px;gap:8px;color:#eef;-webkit-app-region:drag}
textarea{-webkit-app-region:no-drag;flex:1;resize:none;background:transparent;border:0;outline:none;color:#fff;font:17px/1.4 Inter,system-ui}
.r{display:flex;gap:6px;align-items:center;font-size:12px;color:#99a}
.r button{-webkit-app-region:no-drag;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#dde;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.r button.on{background:#7c8cff;color:#fff;border-color:#7c8cff}.sp{flex:1}
</style></head>
<body><div class="c"><textarea id="q" data-l-ph="capture.001" placeholder="" autofocus></textarea>
<div class="r"><button id="m-note" class="on" data-l="html.cap_note"></button><button id="m-ai" data-l="html.cap_ai"></button><span class="sp"></span><span>Ctrl+Alt+Q</span></div></div>
<script src="js/i18n.js"></script>
<script src="capture.js"></script></body></html>
